<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media query</title>
    <style>
        body{
            background-color: red;
        }
        /*Inspect and see by changing dimensions ie when dimensioins will change to whatever you have given the mediatype as the properties will change*/
        @media screen and (orientation: landscape){
            body{
                background-color: purple;
                border: 2px solid aqua;
            }
        }
        @media only screen and (max-width: 455px){
            body{
                background-color: rgb(76, 0, 255);
                
            }
            .boxes{
                flex-direction: column;
            }
        }
        /*
        Syntax
        @media not|only mediatype and (expressions){
            CSS-Code;
        }
        */
        .boxes{
            display: flex;
        }
        .box{
            width: 344px;
            height: 344px;
            background-color: steelblue;
            padding: 3px;
            margin: 3px;
        }
    </style>
</head>
<body>
    <div>
        Hey I am a red body guy!
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
