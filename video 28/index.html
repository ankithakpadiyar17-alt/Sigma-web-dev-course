<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS position</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 133px;
            width: 80vw;
            padding: 3px;
            margin:3px;
            border: 2px solid black;
        }
        .box1{
            background-color: aqua;
            position: sticky;
            /*Will make it sticks when scrolled out of the screen again when used with bottom lines*/
            top: 0px;
            height: 111px;
            width: 100%;
            margin: 0;
            padding: 0;
            
            /* position: absolute;
            This will make the element get relative to nearest parent ie if no position mentioned it will go on searching to its parent and will end in html tag and that means it will set as thefirst element that is after 1px and ofcourse with below line
            top: 0px; */
        }
        .box2{
            background-color: rgb(26, 8, 126);
            width: 1000px;
            position: relative;
            
            /*makes the box move in a way without effecting other elements by adding below lines*/
            top: 34px;
            left: 56px;
        
        }
        .box3{
            background-color: rgb(121, 140, 107);
            position: fixed;
            /*Makes the box be fixed ie even if you scroll you can see that the box won't move again when used wiuth bottom lines*/
            bottom: 0px;
            left: 25vw;
        }
        .box4{
            background-color: purple;
            

        }
        .parent{
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
            height: 1000px;
            /*transform, filter or perspective properties can also make an element appear as positioned (relative)*/
            transform: translate(0);
            filter: invert(0);/*inverts color but dosen't if 0 in brcaes*/
            perspective: 0em;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
