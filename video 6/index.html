
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple HTML page">
    <title>Let's Learn HTML</title>
</head>
<body>
      <h1>Form to apply for a job</h1>
      <form action="post">
          <div>
              <label for="name">Name:</label>
              <input type="text" name="name" id="name" placeholder="Enter your name" autofocus><br><br>
          </div>
          <div>
              <label for="email">Email:</label>
              <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>
            </div>
            <div>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female    " value="female">
                <label for="female">Female</label><br><br>  
            </div>
            <div>
                <input type="checkbox" name="vehicle1" id="vehicle1" value="Bike">
                <label for="vehicle1"> I have a bike</label><br> <br>   
        
            </div>
            <div>
                <label for="message">Message:</label><br>
                <textarea name="message" id="message" cols="30" rows="10" placeholder="Enter your message"></textarea><br><br>
                
            </div>
            <div>
                <select name="country" id="country">
                    <option value="india">India</option>
                    <option value="usa">USA</option>
                    <option value="uk">UK</option>
                    <option value="canada">Canada</option>
            </div>
      </form>
</body>
</html>
